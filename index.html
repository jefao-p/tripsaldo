<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#08786f"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="TripSaldo"><title>TripSaldo</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f7f6;color:#142925;font:15px -apple-system,BlinkMacSystemFont,Segoe UI,sans-serif}.app{max-width:620px;margin:auto;padding:22px 16px 36px}header{display:flex;justify-content:space-between;align-items:center}h1{margin:0;font-size:21px}small{color:#63756f}.hero{margin:17px 0 14px;padding:21px;border-radius:22px;background:linear-gradient(135deg,#075e57,#10a28f);color:white}.hero small{color:white}.balance{font-size:34px;font-weight:800;margin:5px 0 16px}.counts{display:flex;justify-content:space-between;border-top:1px solid #ffffff55;padding-top:11px;font-size:12px}.actions,.metrics{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}button,input,select{font:inherit}.actions button,.save,.share{border:0;border-radius:15px;padding:14px 7px;font-weight:750}.money{background:#e5f6f1;color:#08786f}.expense,.save{background:#08786f;color:white}.box{background:#fff;border:1px solid #dce7e3;border-radius:16px;padding:14px}.metric small{display:block;margin-bottom:6px}.panel h2{font-size:15px;margin:0 0 8px}.empty{text-align:center;color:#63756f;padding:22px}.entry{display:flex;gap:10px;align-items:center;padding:11px 0;border-bottom:1px solid #dce7e3}.entry:last-child{border:0}.entry i{font-style:normal;font-size:22px}.entry span{flex:1}.entry small{display:block;font-size:11px}.modal{display:none;position:fixed;inset:0;background:#123c3470;z-index:4;align-items:end}.modal.show{display:flex}.sheet{width:100%;max-width:620px;margin:auto;background:#f4f7f6;border-radius:24px 24px 0 0;padding:20px 16px calc(30px + env(safe-area-inset-bottom))}.sheet h2{margin:0;font-size:19px}.close,.report{border:0;background:#fff;border-radius:11px;padding:9px 11px;font-size:18px}.tabs{display:grid;grid-template-columns:1fr 1fr;background:#e0eae6;padding:4px;border-radius:12px;margin:14px 0}.tabs button{border:0;padding:10px;border-radius:9px;color:#63756f}.tabs .on{background:white;color:#08786f}form{display:grid;gap:11px}label{font-size:12px;color:#63756f;font-weight:700}input,select{display:block;width:100%;margin-top:5px;padding:12px;border:1px solid #dce7e3;border-radius:12px;background:#fff;color:#142925}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.photo{border:1px dashed #9ec3b9;padding:11px;border-radius:12px;color:#08786f}.photo input{border:0;padding:5px 0}.cat{padding:10px 0;border-bottom:1px solid #dce7e3}.share{background:#1e9b57;color:white;width:100%;margin-top:14px}.bar{height:6px;border-radius:6px;background:#e3ece8;margin-top:5px}.bar i{display:block;height:100%;background:#08786f;border-radius:6px}</style><body><main class="app"><header><div><h1>TripSaldo</h1><small>Minha viagem</small></div><button class="report" onclick="showModal(&quot;report&quot;)">▤</button></header><section class="hero"><small>Saldo disponível</small><div class="balance" id="balance">R$ 0,00</div><div class="counts"><span id="count">0 lançamentos</span><span id="receipts">0 comprovantes</span></div></section><section class="actions"><button class="money" onclick="openForm(&quot;income&quot;)">+ Adicionar dinheiro</button><button class="expense" onclick="openForm(&quot;expense&quot;)">− Nova despesa</button></section><section class="metrics"><div class="box metric"><small>Dinheiro adicionado</small><b id="income">R$ 0,00</b></div><div class="box metric"><small>Gasto na viagem</small><b id="expense">R$ 0,00</b></div></section><section class="box panel"><h2>Últimos lançamentos</h2><div id="list" class="empty">Comece adicionando dinheiro ou uma despesa.</div></section></main><div class="modal" id="form"><section class="sheet"><header><h2 id="formTitle">Nova despesa</h2><button class="close" onclick="hideModal(&quot;form&quot;)">×</button></header><div class="tabs"><button id="inTab" onclick="setKind(&quot;income&quot;)">Dinheiro</button><button id="outTab" class="on" onclick="setKind(&quot;expense&quot;)">Despesa</button></div><form onsubmit="save(event)"><label>Descrição<input id="description" required placeholder="Ex.: almoço, Pix, hotel"></label><div class="row"><label>Valor (R$)<input id="amount" type="number" required min="0.01" step="0.01" inputmode="decimal"></label><label>Categoria<select id="category"><option>Alimentação</option><option>Hospedagem</option><option>Transporte</option><option>Passeios</option><option>Compras</option><option>Dinheiro</option><option>Outros</option></select></label></div><label class="photo" id="photoLabel">Foto do comprovante<input id="photo" type="file" accept="image/*" capture="environment"></label><button class="save">Salvar lançamento</button></form></section></div><div class="modal" id="report"><section class="sheet"><header><h2>Relatório da viagem</h2><button class="close" onclick="hideModal(&quot;report&quot;)">×</button></header><section class="hero"><small>Saldo final</small><div class="balance" id="final">R$ 0,00</div></section><section class="box"><h2>Gastos por categoria</h2><div id="categories"></div></section><button class="share" onclick="shareWhats()">Compartilhar no WhatsApp</button></section></div><script>let data=JSON.parse(localStorage.getItem("tripsaldo")||"[]"),kind="expense",photo="";let $=x=>document.getElementById(x),cash=x=>Number(x||0).toLocaleString("pt-BR",{style:"currency",currency:"BRL"});function totals(){return data.reduce((r,x)=>{r[x.kind]+=x.amount;return r},{income:0,expense:0})}function showModal(x){$(x).classList.add("show");draw()}function hideModal(x){$(x).classList.remove("show")}function setKind(x){kind=x;$("inTab").className=x=="income"?"on":"";$("outTab").className=x=="expense"?"on":"";$("formTitle").textContent=x=="income"?"Adicionar dinheiro":"Nova despesa";$("photoLabel").style.display=x=="income"?"none":"block";if(x=="income")$("category").value="Dinheiro"}function openForm(x){setKind(x);showModal("form")}$("photo").onchange=e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader;r.onload=()=>photo=r.result;r.readAsDataURL(f)};function save(e){e.preventDefault();data.push({kind:kind,description:$("description").value,amount:+$("amount").value,category:$("category").value,photo:photo,date:Date.now()});localStorage.setItem("tripsaldo",JSON.stringify(data));photo="";e.target.reset();hideModal("form");draw()}function draw(){let t=totals(),cats={};data.filter(x=>x.kind=="expense").forEach(x=>cats[x.category]=(cats[x.category]||0)+x.amount);$("balance").textContent=cash(t.income-t.expense);$("income").textContent=cash(t.income);$("expense").textContent=cash(t.expense);$("final").textContent=cash(t.income-t.expense);$("count").textContent=data.length+" lançamentos";$("receipts").textContent=data.filter(x=>x.photo).length+" comprovantes";$("list").innerHTML=data.length?data.slice().reverse().slice(0,5).map(x=>`<div class="entry"><i>${x.kind=="income"?"💰":"🧾"}</i><span><b>${x.description}</b><small>${x.category}</small></span><b>${x.kind=="income"?"+":"−"} ${cash(x.amount)}</b></div>`).join(""):"<div class=empty>Comece adicionando dinheiro ou uma despesa.</div>";let max=Math.max(...Object.values(cats),1);$("categories").innerHTML=Object.keys(cats).length?Object.entries(cats).map(x=>`<div class=cat>${x[0]} <b style="float:right">${cash(x[1])}</b><div class=bar><i style="width:${x[1]/max*100}%"></i></div></div>`).join(""):"<div class=empty>Sem despesas.</div>"}function shareWhats(){let t=totals(),s=`Relatório de viagem\n\nDinheiro adicionado: ${cash(t.income)}\nTotal gasto: ${cash(t.expense)}\nSaldo restante: ${cash(t.income-t.expense)}\nLançamentos: ${data.length}`;location.href="https://wa.me/?text="+encodeURIComponent(s)}draw()</script></body></html>
